<header class="dashboard-header">
  <div class="header-content">
    <div class="logo-brand">
      <img src="/assets/logo.png" alt="StockHub Logo" class="brand-logo-image"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
      <!-- Fallback SVG if image not found -->
      <svg width="32" height="32" viewBox="0 0 48 48" fill="none" class="brand-logo-svg" style="display:none;">
        <path d="M8 32L16 24L24 28L40 12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <circle cx="40" cy="12" r="3" fill="currentColor"/>
      </svg>
      <span>THE BULLISH MINDSET </span>
    </div>

    <nav class="header-nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Dashboard</a>
      <a routerLink="/dashboard/recommendations" routerLinkActive="active">Recommendations</a>
      <a routerLink="/dashboard/blog" routerLinkActive="active">Blog</a>
    </nav>

    <div class="header-actions">
      <div class="live-indicator" *ngIf="showLive">
        <span class="pulse"></span>
        <span>Live</span>
      </div>
      <app-theme-toggle></app-theme-toggle>
      <button class="logout-btn" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Logout
      </button>
    </div>
  </div>
</header>
